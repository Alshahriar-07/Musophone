name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    # The release's own assets, named the way the in-app updater expects:
    #   MusoPhone-v3.2.apk, MusoPhone-v3.2-arm64-v8a.apk, ...
    # plus SHA256SUMS.txt and update-manifest.json, which the updater uses to
    # verify that a download is the file this release published. Upload these
    # files to the GitHub Release — the API's per-asset `digest` is the other
    # trusted source, and the app reads either.
    - name: Package release assets
      run: |
        set -euo pipefail
        VERSION_NAME=$(sed -n 's/^extra\["bitchordVersionName"\] = "\(.*\)"/\1/p' build.gradle.kts)
        VERSION_CODE=$(sed -n 's/^extra\["bitchordVersionCode"\] = \([0-9]*\)/\1/p' build.gradle.kts)
        mkdir -p dist
        for apk in app/build/outputs/apk/prod/release/*.apk; do
          base=$(basename "$apk")
          case "$base" in
            *arm64-v8a*) target="MusoPhone-v${VERSION_NAME}-arm64-v8a.apk" ;;
            *armeabi-v7a*) target="MusoPhone-v${VERSION_NAME}-armeabi-v7a.apk" ;;
            *x86_64*) target="MusoPhone-v${VERSION_NAME}-x86_64.apk" ;;
            *) target="MusoPhone-v${VERSION_NAME}.apk" ;;
          esac
          cp "$apk" "dist/$target"
        done
        cd dist
        sha256sum *.apk > SHA256SUMS.txt
        python3 - "${VERSION_NAME}" "${VERSION_CODE}" <<'PY'
        import hashlib, json, os, sys
        version, code = sys.argv[1], int(sys.argv[2])
        assets = []
        for name in sorted(n for n in os.listdir('.') if n.endswith('.apk')):
            digest = hashlib.sha256(open(name, 'rb').read()).hexdigest()
            arch = 'universal'
            for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                if name.endswith(f'-{abi}.apk'):
                    arch = abi
            assets.append({'name': name, 'architecture': arch, 'sha256': digest})
        json.dump({'versionName': version, 'versionCode': code, 'assets': assets},
                  open('update-manifest.json', 'w'), indent=2)
        PY

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musophone-prod-release-signed
        path: |
          dist/*.apk
          dist/SHA256SUMS.txt
          dist/update-manifest.json

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: musophone-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
