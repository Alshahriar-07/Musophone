<svg width="28" height="18.6" viewBox="0 0 730 484" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The MusoPhone mark: an M drawn as one continuous waveform stroke.
    The valley in the middle is the same beat the app's player draws, and the
    single weight (64 in this 484-unit box) is what makes the glyph sit at
    1.9px when the header renders it at 22px tall, matching the app's icons.
  -->
  <path
    stroke="currentColor"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M46 434V74L365 418L684 74V434" />
</svg>
