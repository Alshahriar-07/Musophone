<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MusoPhone social card</title>
    <style>
      /*
       * Source for app/public/og-image.png. Render it with Chrome:
       *   chrome --headless=new --disable-gpu --screenshot=og-image.png \
       *     --window-size=1200,630 --hide-scrollbars scripts/brand/og-image.html
       * The mark is the project's official icon (web/assets/icon.png), not a
       * redrawn substitute.
       * Every colour here matches app/src/styles/tokens.css.
       */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #000;
        color: #f7f7f9;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 80px;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: -220px 380px 220px -220px;
        background: radial-gradient(circle at 30% 30%, rgba(255, 77, 103, 0.24), transparent 62%);
        filter: blur(30px);
      }
      .glow-2 {
        position: absolute;
        width: 460px;
        height: 460px;
        right: -160px;
        bottom: -220px;
        background: radial-gradient(circle, rgba(255, 77, 103, 0.13), transparent 68%);
      }
      .top { display: flex; align-items: center; gap: 16px; position: relative; }
      .mark { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 16px 44px rgba(0, 0, 0, 0.6); }
      .wordmark { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
      .chip {
        margin-left: auto;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #ff6b82;
        font-size: 17px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 999px;
        letter-spacing: 0.02em;
      }
      main { position: relative; }
      h1 { font-size: 100px; line-height: 1; letter-spacing: -0.035em; font-weight: 700; }
      h1 span { color: #ff4d67; }
      p { margin-top: 24px; font-size: 30px; color: #a4a4ac; max-width: 820px; line-height: 1.35; }
      footer {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 19px;
        color: #6f6f78;
        position: relative;
      }
      .rule { width: 44px; height: 2px; background: #ff4d67; border-radius: 2px; }
      .platforms { margin-left: auto; display: flex; gap: 26px; color: #a4a4ac; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="top">
      <img class="mark" src="../../assets/icon.png" alt="" />
      <div class="wordmark">MusoPhone</div>
      <div class="chip">v2.6</div>
    </div>
    <main>
      <h1>Music, <span>uninterrupted.</span></h1>
      <p>An independent, premium player for the music you already love — on the web, on Android, and in your browser.</p>
    </main>
    <footer>
      <div class="rule"></div>
      <div>Designed &amp; developed by Al Shahriar Sowan · Eagox Studio</div>
      <div class="platforms">
        <span>Web player</span>
        <span>Android</span>
        <span>Extension</span>
      </div>
    </footer>
  </body>
</html>
